schema_version: 1
source: "02_天界普通女生的一天_StoryLock_V1.0.md + 03_天界普通女生的一天_20张分镜修订草稿_V1.2.md"
frames:
  1: "出门时风把头发吹乱了，她替我压住碎发，我们就这样拍下第一张。"
  2: "顺着石阶下楼，邻居已经在挑水，窗边的衣服也晾起来了。"
  3: "我们给还没到的他留了一份热糕，三个人都知道他多半又睡过头了。"
  4: "他果然来晚了，看到特地留给他的热糕，赶紧拿点心给我们赔罪。"
  5: "吃完饭一起过云桥，桥上全是赶着过日子的普通人。"
  6: "轮到我去登记几张纸签，忙完还能喝上半杯茶。"
  7: "他们在窗外等我，敲着窗催我赶紧去吃午饭。"
  8: "他又抢了最好的窗边位，被我们笑着往里挪，好让端盘子的朋友坐下。"
  9: "抢了窗边位还想抢最后一块点心，怎么能总让他得逞。"
  10: "本来吃完就各回各家，她却说，不如再去旧云市逛逛。"
  11: "旧云市的木铺一个挨着一个，买菜和挑担的人从身边走过。"
  12: "她在铜镜前试木簪，我替她把散下来的头发拢起来。"
  13: "他们一人拎一包点心，偏要装成搬了多重的东西。"
  14: "在茶摊坐下歇脚，我还从街边木铺买了一支小木簪。"
  15: "茶杯刚见底，摊主开始收桌，夕光也慢慢照进了街口。"
  16: "看着西桥那边的晚霞，她说，既然还早，再坐一会儿吧。"
  17: "我们站在西桥看了一阵云海，谁都没有急着说话。"
  18: "这回他没抢，反而主动把最后一块点心分给了我们。"
  19: "街灯亮了，三个朋友各自拐进巷口，还不忘回头挥手。"
  20: "回到云廊，空纸包、今天买的小木簪和一点晚霞都在照片里。"
