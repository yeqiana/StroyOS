# Story OS 当前生效配置
# ============================================================
# 这是人工查看和修改 Story OS 生产参数的唯一入口。
# 后续流程必须先读取并校验本文件，再读取 Runtime Request、Episode
# 合同和运行证据。Episode 的 meta/*.json 仍保存事实和证据，不是配置。
#
# 修改原则：
# 1. 修改本文件只影响后续新请求或重新编译的派生合同。
# 2. 不自动改写已经绑定的 meta/runtime-request.json。
# 3. 不自动修改历史 Episode 的 stage、批准记录或资产 SHA。
# 4. 字段写错时必须 fail-fast，禁止静默回落到散落在代码里的默认值。

schema_version: 1
config_version: "1.0"

# Unified business model policy; business consumers resolve roles through profiles.
models:
  policy_version: "lean-2026-09-30-v1"
  profiles:
    orchestration:
      model: gpt-6-luna
      reasoning_effort: high
    authoring:
      model: gpt-6-luna
      reasoning_effort: high
    structured_text:
      model: gpt-6-luna
      reasoning_effort: high
    semantic_critic:
      model: gpt-6-luna
      reasoning_effort: high
    final_semantic:
      model: gpt-6-luna
      reasoning_effort: high
    vision_fast:
      model: gpt-6-luna
      reasoning_effort: high
    vision_final:
      model: gpt-6-luna
      reasoning_effort: high
    image_controller:
      model: gpt-6-luna
      reasoning_effort: high
    image_payload:
      model: gpt-image-2.5-flare
      quality: high
      fallback_models:
        - gpt-image-2.5-sunburst
        - gpt-image-2
  role_aliases:
    orchestration: orchestration
    story.authoring: authoring
    story.rewrite: authoring
    preimage.character_finalize: structured_text
    preimage.world_prepare: structured_text
    preimage.frame_contract: structured_text
    preimage.visual_narrative: authoring
    prompt.production: structured_text
    prompt.repair: structured_text
    release: structured_text
    critic.story: semantic_critic
    critic.preimage: semantic_critic
    critic.final: final_semantic
    vision.fast: vision_fast
    guardian: vision_fast
    vision.visual_lock: vision_final
    vision.final: vision_final
    image.controller: image_controller
    image.payload: image_payload

image:
  # 新 Episode 未指定时采用的正文比例。
  default_aspect_ratio: "4:5"

  # 允许锁定的正文比例及最终标准画布。比例一旦进入正式分镜，
  # Generation Request、RAW、Normalize、Approved、Release 全程一致。
  canvases:
    "4:5":
      width: 1080
      height: 1350
    "9:16":
      width: 1080
      height: 1920

  # Style 和 Seed 不作为独立生产参数；视觉与连续性分别由
  # Visual Profile、Capture Grammar、Frame Contract 和 Reference 控制。
  style_parameter: none
  seed: none

provider:
  # Provider Capability 只描述真实后端能力，不创建第二套视觉权威。
  registry: config/providers/index.json
  # V2.4.1 Provider Runtime 负责 API / Codex transport 选择；它只产生执行证据。
  runtime: config/providers/image-provider-runtime.json
  exact_raw_canvas_required: false
  measure_raw_dimensions_locally: true
  provider_receipt_required: true
  # 多人身份参考压缩是产品生成行为，不再由未声明 env-only 开关决定。
  # STORY_OS_GROUP_REFERENCE_PROXY 仍可作为单次运维覆盖，effective-config 会记录来源。
  group_reference_proxy: false

creative:
  # 账号级长期创作画像：只约束常用题材、进入方式与账号视觉身份，不覆盖单集 Story Lock。
  account_profile_path: config/profiles/account_creative/default.json

directing:
  # 导演语法：镜头尺度、经典电影结构参考、现实光影与异常隐藏载体。
  grammar_path: standards/directing_grammar_v1.json

visual:
  # 用户未指定其他视觉体系时使用的母风格。
  default_profile_id: M00
  default_profile_name: 现实生活纪实母版
  default_profile_path: standards/visual_profiles/M00_MP4_网吧_流水席_旧数码.json

  # 默认设备档案。具体年代和设备物理真实性高于母风格质感。
  default_capture_profile_id: CP01
  capture_profile_registry: standards/capture_profiles/index.json
  # CG01 只定义单帧的摄影者、站位、随手拍行为与设备瑕疵物理。
  # 它不再承载开篇节奏、镜头族变化或跨帧连续性等序列规则。
  default_capture_grammar_id: FIRST_PERSON_CASUAL_SNAPSHOT_V1
  capture_grammar_path: standards/capture_grammars/FIRST_PERSON_CASUAL_SNAPSHOT_V1.json

  # SG01 定义一整集的拍摄者分配、开篇记忆、镜头族节奏、连续性和
  # 屏幕信息连续性。可在 Episode 的 meta/sequence-grammar.json 显式覆盖。
  default_sequence_grammar_id: SG01_PERSONAL_EVIDENCE_SEQUENCE_V1
  sequence_grammar_path: standards/sequence_grammars/SG01_personal_evidence_sequence.json

normalize:
  # NP01 只做技术标准化，不负责重新构图。
  enabled: true
  preserve_raw: true
  final_format: PNG
  resize_algorithm: Lanczos

  # 正常生产禁止裁切。ImageOps.fit 只允许未来显式登记的异常兼容流程，
  # 不能由默认链路自动启用。
  default_crop: forbidden
  imageops_fit: exception_only

  # RAW 已是目标 PNG 且尺寸一致时仅复制文件，不重新编码。
  noop_when_exact_match: true

  # 比例偏差采用相对误差：abs(source-target)/target。
  # ≤0.01 才允许技术性 Lanczos resize；0.01–0.03 必须人工复核；
  # >0.03 直接 Reject，先检查 Generation Request，禁止用拉伸掩盖错误。
  automatic_ratio_delta_max: 0.01
  review_ratio_delta_max: 0.03

  # Provider 偶发会返回 100x100 一类退化缩略图。它们不是可接受的
  # 生产 RAW，必须在比例/Normalize 之前按技术失败判废，避免继续烧审核与返修额度。
  provider_raw_min_dimension: 256

  # 仅供显式 provider 尺寸兼容例外使用。默认链路仍禁止裁切；
  # 只有调用方显式声明技术例外且比例偏差不超过该值时，才允许
  # 轻量中心裁切后再缩放到正式画布，并必须在归一化证据中记录。
  exception_crop_ratio_delta_max: 0.06
  # Provider 返回比例与请求画布不一致时，是否允许走上面的显式轻裁切例外。
  # 默认关闭；STORY_OS_PROVIDER_RATIO_CROP_EXCEPTION 只作为临时运维覆盖。
  provider_ratio_crop_exception_enabled: false

  # Normalize I/O 失败只在本地重试。重试耗尽后保留 RAW 并阻断，
  # 禁止为了后处理失败再次调用图片生成。
  local_retries: 2
  technical_failure_triggers_generation: false

production:
  # 唯一的整条生产链模式入口。环境变量 STORY_OS_PRODUCTION_MODE 可作单次覆盖。
  # COLLABORATIVE 不会因宿主不可用自动升级为 CODEX_MANAGED。
  mode: COLLABORATIVE

  # 同时在途图片上限，不是固定波次大小。任一任务完成即补下一张。
  max_inflight_images: 5
  review:
    max_inflight: 2
    queue_high_watermark: 6
    queue_low_watermark: 2
  continuous_first_completed: true
  wave_barrier: false
  ledger_single_writer: true
  fail_soft: true
  incremental_reuse: true

  # 每帧最多一次普通内容返修；网络、超时、Normalize 等技术失败不计入。
  max_content_repairs_per_frame: 1
  technical_retry_counts_as_content_repair: false

  # Local Visual Triage：在图片写入 Production Ledger 前做轻量确定性检查。
  # 只有不可解码/正式画布不匹配等硬技术故障允许阻断 commit；其余全部只标 SUSPECT。
  local_visual_triage:
    enabled: true
    hard_failures_block_commit: true
    near_duplicate_phash_max_distance: 4
    near_duplicate_dhash_max_distance: 4
    low_entropy_warn_below: 1.5
    dark_luma_warn_below: 5.0
    bright_luma_warn_above: 250.0
    low_edge_mean_warn_below: 1.5
    repair_noop_rms_max: 0.002
    repair_ssim_warn_below: 0.55
    # DINOv2/同类 embedding 通过显式本地 ONNX 模型启用；StoryOS 永不自动下载模型。
    embedding:
      enabled: false
      provider: onnx
      model_path: ""
      input_size: 224
    # SFace 只做 individual character-master crop 排序；阈值未校准前绝不参与 PASS/FAIL。
    sface:
      enabled: true
      max_references: 2
    # Grounding DINO：只使用显式本地模型目录，不允许 Runtime 在线下载。
    grounding_dino:
      enabled: false
      model_path: ""
      max_queries: 8
      box_threshold: 0.35
      text_threshold: 0.25
      flag_missing_queries: false
    # SAM2：只围绕 Repair changed bbox 生成 advisory mask。
    sam2:
      enabled: false
      model_path: ""
      broad_mask_warn_above: 0.65
    # RTMPose/兼容 ONNX：只做姿态置信度诊断，不授予 anatomy PASS。
    pose:
      enabled: false
      model_path: ""
      input_width: 192
      input_height: 256
      mean_confidence_warn_below: 0.15
    # LPIPS：可选 Repair perceptual drift；依赖缺失时 fail-soft SKIP。
    lpips:
      enabled: false
      net: alex
      max_side: 512
      warn_above: 0.45

  # Visual Lock ordinary baseline 在普通返修仍失败后，可再生成有界竞争候选。
  # 这些候选不增加 content_repairs_used；任意一张经 Codex Vision PASS 即成为 Pixel Master。
  visual_lock_baseline_pool:
    enabled: true
    max_additional_candidates: 2

  # Visual Lock 非 baseline admission 在普通返修仍失败后，也允许有界竞争候选。
  # 仍不增加 content_repairs_used；每帧最多 2 个候选，全部真实 FAIL 才需要人工。
  visual_lock_admission_pool:
    enabled: true
    max_additional_candidates_per_frame: 2

  # 图片 backend 技术失败独立于内容返修/候选池；以 max_attempts_per_item 实际配置为准。
  # 当前为 1 次、无自动退避重试：失败后记录真实阻断原因，由恢复逻辑决定下一步；不可伪装成内容 FAIL。
  technical_retry:
    max_attempts_per_item: 1
    backoff_seconds: []

agent_runtime:
  # Trace 只记录执行事实，不是第二套 Episode State。
  trace:
    enabled: true
    config: config/agent_runtime/trace.json

  # 请求解析默认规则优先，不默认使用 LLM 自由改写。
  intent:
    enabled: true
    config: config/agent_runtime/intent.json

  # Router 只产生执行决策证据，不改变 episode-state.json。
  router:
    enabled: true
    config: config/agent_runtime/router.json
    decision_path: meta/runtime-route.json

  # V2.4 Batch Image Runtime：Production 执行策略，不是新的用户 Intent。
  batch:
    enabled: true
    config: config/agent_runtime/batch.json

  # Codex 图片执行能力：Logical Batch 仍按 5 帧管理，实际最多 5 个 Codex 图片 worker 同时在途，失败时 5→4→3→2→1。整体 Runtime 可保持 WORK。
  codex_subscription_batch:
    enabled: true
    config: config/agent_runtime/codex-subscription-batch.json

  # Specialized Agent Adapter 按 adapter 独立开关。Character Finalize 已通过 P1 Cutover Gate；
  # Production 走 Agent Adapter，仍复用原 verifier/barrier/authority_commit；技术故障保留 legacy fallback。
  adapters:
    character_finalize:
      shadow_enabled: false
      production_enabled: true
      legacy_fallback_on_technical: true
    world_prepare:
      # P2 starts Shadow-first; canonical WORLD_PREPARE remains legacy until its own cutover gate passes.
      shadow_enabled: true
      production_enabled: false
      legacy_fallback_on_technical: true
    visual_narrative_prepare:
      shadow_enabled: false
      production_enabled: true
      legacy_fallback_on_technical: true
    story_semantic_critic:
      # 正式生产默认关闭研究性 Shadow；Story Review 仍为唯一裁决。
      shadow_enabled: false
      production_enabled: false
      legacy_fallback_on_technical: true
      bounded_reflection:
        max_review_attempts: 2
        max_auto_repairs: 1
    preimage_semantic_critic:
      # 正式生产默认关闭 PREIMAGE Shadow；确定性校验继续生效。
      shadow_enabled: false
      production_enabled: false
      legacy_fallback_on_technical: true
      bounded_reflection:
        max_review_attempts: 2
        max_auto_repairs: 1
    final_semantic_critic:
      # 正式生产默认关闭 Final Shadow；帧语义正式裁决继续生效。
      shadow_enabled: false
      production_enabled: false
      legacy_fallback_on_technical: true
      bounded_reflection:
        max_review_attempts: 2
        max_auto_repairs: 1

  # P4 task-level provider/model routing. Runtime DAG/Scheduler retains dispatch ownership.
  task_capability_router:
    shadow_enabled: true
    production_enabled: true
    health_ttl_seconds: 300
    max_fallback_depth: 3
    policy_mode: LEGACY_PREFERRED_CAPABILITY_GUARDED
    supported_task_types:
      - story_semantic_critic
      - preimage_semantic_critic
      - final_semantic_critic

  # P5 observes existing runtime failures; recovery ownership stays with current modules.
  guardian_facade:
    shadow_enabled: true
    production_enabled: false

execution:
  # 可替换执行能力，与 production.mode（整链控制方式）相互独立。
  workspace:
    provider: webcodex
  image:
    executor: CODEX
  vision_review:
    executor: CODEX

runtime:
  # 当前整体 Runtime = WORK：Story、前期资产、门禁与发布由产品运行时执行。
  # Codex 仅用于配置为 CODEX 的图片生成/返修与像素审查执行层。
  preferred_runtime: WORK

  # WORK 只定义创作/治理运行时角色；仓库访问由独立 Workspace Provider 提供。
  # WebCodex 通过 ChatGPT MCP -> WebCodex Server -> Runner 访问本机 Project。
  # Provider 不是 Episode Runtime、不是 Authority，也不由 StoryOS shell 启动。
  workspace:
    provider: webcodex
    transport: WEBCODEX
    execution_mode: host_mcp_runner

  # 图片执行是独立执行层。CODEX 表示仅在正式 image generation / image repair 时
  # 显式使用本机 Codex 图片能力；它不改变 preferred_runtime，也不授权 Codex full-auto。
  # 迁移兼容别名；新配置入口为 execution.image.executor。
  # 环境变量优先级：STORY_OS_IMAGE_EXECUTOR > legacy STORY_OS_IMAGE_RUNTIME > YAML。
  image_execution_runtime: CODEX
  local_codex_fallback: explicit_only
  # 兼容字段，必须关闭。COLLABORATIVE 的宿主不可用时暂停/阻塞，等待恢复或显式切换。
  codex_fallback_when_webcodex_unavailable: false
  continuous_host_loop: true
  host_loop_max_cycles: 64
  next_action_path: meta/runtime/next-action.json

  # Review 按能力拆分：WORK 拥有文本/治理审核权；实际像素审核由独立 Codex Vision critic 执行。
  # ChatGPT Web/App 只是 UI，不映射为 Story OS WEB Runtime；WebCodex 只是 WORK 的 Workspace Provider。
  review:
    text:
      runtime: WORK
      isolated_required: true
      fresh_turn_required: true
    vision:
      runtime: CODEX
      isolated_required: true
      ephemeral: true
      generation_session_reuse: false
      # Final Semantic FULL Review 的最大局部 Critic 并发。20 帧默认自适应到 4；
      # 更小帧集按 1/2/3 自动降档。只控制只读 Critic fan-out，Ledger 仍单写。
      max_inflight_final: 4
    governance:
      runtime: WORK
    allow_web_runtime: false
    # 本地视觉影子诊断（RapidOCR / OpenCV YuNet）。只产出派生提示，绝不替代
    # 正式像素审核：enabled 控制是否运行影子；gate_hint 控制是否把影子结果作为
    # 参考提示注入正式 Critic 上下文。gate_hint=true 时模型仍独立看像素、独立
    # 判定，本地预检缺省不等于 PASS，不放行也不跳过审核。
    local_vision_shadow:
      enabled: true
      gate_hint: true
      # 本地字幕直审：当前逐帧语义证据有效、OCR 完整无文字重叠、布局与渲染完整性通过时，
      # 直接跳过该帧视觉复审。此策略不判断字幕是否遮挡人物/道具等非文字线索，属于用户
      # 确认接受的取舍；关闭即可恢复原有全量审核。
      local_gate_enabled: true

    # Legacy runtime aliases: workspace/provider 已迁移到 runtime.workspace。
    # `allow_local_codex_review=false` now means text/governance review only; vision review uses review.vision.
    runtime: WORK
    isolated_critic_required: true
    fresh_product_review_turn_required: true
    allow_local_codex_review: false

  # 新篇默认走分段 DAG；PREIMAGE_COMPILE 是执行节点，不是新的 Episode stage。
  execution_mode: dag
  # 唯一有执行消费者的并行开关：帧合约并行编译（frame_contract.py:585）。
  # 2026-09-15 W-91：原 parallel.authority_enabled / derived_enabled 已删除——
  # 全仓唯一的读取点是 validate() 的类型检查，改成 false 不改变任何行为，
  # 却让人以为 authority / derived 两条 lane 各自受开关控制。两条 lane 的实际
  # 并发量由下面对应的 workers.* 决定，不再有并列的第二套开关。
  preimage_parallel_enabled: true
  # local_codex_preimage → 仅显式本地 CODEX fallback 的 PREIMAGE fan-out；
  # WORK + WebCodex 正式生产的 PREIMAGE 并发由 Workspace Provider/Host 管理，不伪装成本地指标。
  # derived → Frame Contract 本地并行编译并发（frame_contract.py）。
  # 2026-09-15 W-90/W-92：复核确认 composite Runtime DAG 本身保持串行；
  # image 并发属于 image_scheduler，production_plan 仅作 diagnostic planner。
  workers:
    local_codex_preimage: 4
    derived: 6
  canonical_stage_source: meta/episode-state.json
  runtime_request_path: meta/runtime-request.json

  # 每个阶段只读取 config/index.yaml 声明的最小文件集合；
  # 仅在缺依赖或发现冲突时扩大扫描。
  read_index_first: true
  recursive_repository_scan_default: false

paths:
  # 以下路径供 Loader 和 Agent 路由。不要在其他文档重复维护一套。
  index: config/index.yaml
  product_manifest: story_os_manifest.json
  creative_authority: standards/制作规范_正式版.md
  authority_index: standards/AUTHORITY_INDEX.json
  runtime_contract: runtimes/runtime-contract.json
  provider_registry: config/providers/index.json
  workflow_contract: runtimes/workflow-contract.json
  engine: episodes/_system
  episodes: episodes
  reports: reports
  internal_history: .storyos/history

storage:
  # 数据库与缓存的部署拓扑。这里只写「仓库默认值」；生产 / 本机实际值由运行时
  # 环境提供。解析优先级（高 → 低）由 episodes/_system/storage_config.py 固定：
  #     显式构造参数 > 环境变量 > 本文件默认值
  #
  # 凭据永不写入本文件：password_env 存的是环境变量「名字」，不是值。
  # STORYOS_MYSQL_PWD / STORYOS_REDIS_PASSWORD 的真实值只存在于运行时环境，
  # 与 platform/ 两个连接模块的 docstring 声明一致。
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    database: story_os_runtime
    password_env: STORYOS_MYSQL_PWD
  redis:
    host: 127.0.0.1
    port: 6379
    db: 0
    timeout_seconds: 5
    password_env: STORYOS_REDIS_PASSWORD
  # Runtime event/trace/artifact 正式权威为 MySQL；jsonl/dual 仅用于显式兼容或迁移。
  # platform/ 不读取 YAML；应用层解析后显式注入。
  runtime_store:
    mode: mysql
    jsonl_root: .storyos
  # Episode 结构化元数据正式权威为 MySQL。合同/审核/交付等文件型 Artifact
  # 仍可保留，但不再承担运行状态数据库职责。
  episode_meta_store:
    mode: mysql
  # Runtime 可重建热状态正式权威为 Redis；redis 模式禁止文件 fallback，
  # 纯热状态也停止生成兼容 JSON 影子副本。
  hot_state:
    mode: redis

compatibility:
  # 契约位：历史 JSON 请求/证据可读，但新的人工配置只写本 YAML。
  # read_legacy_json=false 时，任何 legacy JSON 读取必须先经
  # storyos_config.guard_legacy_json_read 并显式报错，禁止静默读旧格式。
  read_legacy_json: true
  # 以下两开关当前无对应写路径；新增回写 bound runtime request / 迁移
  # 历史 episode meta 的代码必须显式读取本开关，false 表示禁止该行为。
  rewrite_bound_runtime_request: false
  migrate_historical_episode_meta: false

timeout_policy:
  # Story OS 超时默认值唯一人工配置面；数值为历史默认（行为不变）。
  # 运行类别含义见 episodes/_system/runtime_timeout_policy.py DEFAULT_SECONDS。
  codex_supervisor_run: 7200
  codex_scoped_step: 3600
  image_worker_request: 600
  image_lane_run: 600
  visual_baseline_critic: 300
  fast_scout: 240
  review_critic: 900
  codex_auth_probe: 30
  image_tool_visibility_probe: 120
  driver_carrier_control: 60
  image_probe: 900
  deep_semantic_review: 1800
  release_semantic: 1800
  isolated_ml_probe: 30
  isolated_ml_worker: 180
  authority_lock: 30
  phase5a_canary_run: 900
