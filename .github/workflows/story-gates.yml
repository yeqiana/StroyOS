name: Story Gates

on:
  pull_request:
    paths:
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - "story_os_manifest.json"
      - "START_HERE.md"
      - "README.md"
      - "README_UPGRADE.md"
      - "INSTALL_WINDOWS.ps1"
      - "episodes/**"
      - "standards/**"
      - "runtimes/**"
      - "skills/dali-cat-story/**"
      - "SKILL.md"
      - "AGENTS.md"
      - ".github/workflows/story-gates.yml"
  push:
    branches: [story]
    paths:
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - "story_os_manifest.json"
      - "START_HERE.md"
      - "README.md"
      - "README_UPGRADE.md"
      - "INSTALL_WINDOWS.ps1"
      - "episodes/**/meta/**"
      - "episodes/_system/**"
      - "skills/dali-cat-story/**"
      - "standards/**"
      - "standards/templates/**"
      - "standards/AUTHORITY_INDEX.json"
      - "standards/capture_profiles/**"
      - "standards/story_regressions/**"
      - "runtimes/**"
      - "SKILL.md"
      - "AGENTS.md"
      - ".github/workflows/story-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: episodes/_system/requirements.txt
      - name: Install Story OS runtime dependencies
        run: python -m pip install -r episodes/_system/requirements.txt "pytest>=8,<10"
      - name: Compile Story OS
        run: python -m compileall -q episodes/_system skills/dali-cat-story
      - name: Web draft handoff read-only safety
        run: python scripts/ci_storyos_python.py -m pytest -q tests/platform/test_web_draft_handoff_plan.py
      - name: Image scheduler authority projection regressions
        run: >-
          python scripts/ci_storyos_python.py -m pytest -q
          tests/system/test_image_scheduler_authority_plan.py
          tests/system/test_generation_unknown_technical_retry_guard.py
          tests/system/test_image_scheduler_review_exit_v4.py
      - name: State machine and Story OS unit tests
        # Ephemeral legacy unit fixtures use file-backed hot state only;
        # production Redis authority and separate system tests stay unchanged.
        env:
          STORYOS_HOT_STATE_MODE: file
          STORYOS_EPISODE_META_STORE_MODE: json
        run: |
          # Each command uses a new interpreter with stdlib platform support
          # plus StoryOS platform.repository, avoiding the module name collision.
          python() { command python scripts/ci_storyos_python.py "$@"; }
          python episodes/_system/test_validator.py -v
          python episodes/_system/test_machine_gate.py -v
          python episodes/_system/test_production_reliability.py -v
          python episodes/_system/test_v2_multi_runtime.py -v
          python episodes/_system/test_v201_engineering.py -v
          python episodes/_system/test_v202_production_closure.py -v
          python episodes/_system/test_v203_contract_hardening.py -v
          python episodes/_system/test_v2032_creative_enforcement.py -v
          python episodes/_system/test_v2033_frame_semantic_enforcement.py -v
          # STORY_OS_V2_5_PROPAGATION_CORE
          python episodes/_system/test_v250_propagation_core.py -v
          python episodes/_system/propagation_core_gate.py self-test
          # STORY_OS_V2_5_1_RUNTIME_FAST_PATH
          python episodes/_system/test_v251_runtime_fast_path.py -v
          python episodes/_system/test_v2511_forced_candidate_gate.py -v
          # STORY_OS_V2_6_0_PERFORMANCE_RUNTIME
          python episodes/_system/test_v260_performance_runtime.py -v
          python episodes/_system/runtime_atomic_store.py self-test
          python episodes/_system/runtime_command.py self-test
          python episodes/_system/raw_candidate_budget.py self-test
          python episodes/_system/runtime_circuit_breaker.py self-test
          python episodes/_system/visual_final_freeze.py self-test
          python episodes/_system/caption_image_audit.py self-test
          python episodes/_system/runtime_capability_cache.py self-test
          python episodes/_system/runtime_resume_capsule.py self-test
          python episodes/_system/raw_candidate_budget.py self-test
          python episodes/_system/runtime_fast_path.py self-test
          python episodes/_system/rolling_frame_review.py self-test
          python episodes/_system/story_review.py self-test
          python episodes/_system/visual_review.py self-test
          python episodes/_system/frame_semantic_review.py self-test
          python episodes/_system/subtitle_layout.py self-test
          python episodes/_system/canvas_normalize.py self-test
          python episodes/_system/codex_subscription_image.py self-test
          python episodes/_system/incremental_closure.py self-test
          python episodes/_system/incremental_frame_review.py self-test
          python episodes/_system/media_workspace.py self-test
          python episodes/_system/codex_auto_orchestrator.py self-test
          # Legacy _system suites not previously wired to CI (all rc=0 on Windows 2026-09-07)
          python episodes/_system/test_production_engine.py -v
          python episodes/_system/test_directing_v3_rules.py -v
          python episodes/_system/test_visual_profile_registry.py -v
          python episodes/_system/test_capture_grammar_v226.py
          python episodes/_system/test_capture_grammar_v228.py
          python episodes/_system/test_stage_v224.py self-test
          python episodes/_system/test_stage_v225.py self-test
          python episodes/_system/test_stage_v227.py self-test
          python episodes/_system/test_test_stage_v224.py
          python episodes/_system/test_test_stage_v225.py
          python episodes/_system/test_test_stage_v227.py
          python episodes/_system/test_v211_performance_regression.py
          python episodes/_system/test_v221_world_identity_integration.py
          # Canonical subtitle burn-in renders with Windows-only msyhbd.ttc;
          # the full mock pipeline keeps its pixel coverage on windows-latest.
          if [ "$RUNNER_OS" = "Windows" ]; then
            python episodes/_system/test_v261_full_mock_pipeline.py
          else
            echo "SKIP test_v261_full_mock_pipeline (canonical font C:/Windows/Fonts/msyhbd.ttc is Windows-only)"
          fi
          python episodes/_system/test_v27_async_runtime_failure.py
          python episodes/_system/test_validation_stage_v223.py
          python episodes/_system/test_visual_narrative_core_v22_r2.py
      - name: Runtime system regression tests
        # pytest imports each test by path, loads hermetic conftest fixtures,
        # and avoids test_runtime_evidence_contract.py name collisions.
        run: >-
          python scripts/ci_storyos_python.py -m pytest
          --import-mode=importlib -q tests/system
      - name: Validate Story OS contract and repository health
        # Repository-only fixture checks; never connect to production MySQL/Redis.
        env:
          STORYOS_EPISODE_META_STORE_MODE: json
          STORYOS_HOT_STATE_MODE: file
        run: |
          python scripts/ci_storyos_python.py episodes/_system/contract_sync.py
          python scripts/ci_storyos_python.py episodes/_system/story_os.py doctor
      - name: Compare strict Episode and Machine Gates with pre-integration debt
        # Both --all --metadata-only strict validators run unchanged here.
        # Any new finding or omitted Episode fails. Known historical debt
        # remains visible and cannot authorize production release.
        env:
          STORYOS_EPISODE_META_STORE_MODE: json
          STORYOS_HOT_STATE_MODE: file
        run: python scripts/ci_storyos_python.py scripts/ci_episode_legacy_regression.py check

  # B5 (2026-09-08): manual golden/performance replay gate. Registry is empty
  # until a candidate passes every density/voice/capture/world/lineage/
  # propagation/text gate with zero errors; do not register below that bar.
  golden-replay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: episodes/_system/requirements.txt
      - name: Install Story OS runtime dependencies
        run: python -m pip install -r episodes/_system/requirements.txt
      - name: Golden episode regression
        run: |
          python episodes/_system/golden_episode_regression.py self-test
          python episodes/_system/golden_episode_regression.py run
      - name: Performance replay (PERF-REPLAY-V2.1.1-20260831-停电夜蜕壳)
        run: python episodes/_system/performance_regression_v211.py replay
